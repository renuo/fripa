plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "vendor/**/*"
    - "coverage/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames:
    - cn
    - uid

Metrics/ClassLength:
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  # Configuration#initialize only assigns one variable per option.
  AllowedMethods:
    - initialize
  Exclude:
    - "test/**/*"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"

# Keyword arguments are self-documenting (see Configuration#initialize).
Metrics/ParameterLists:
  CountKeywordArgs: false
